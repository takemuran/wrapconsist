[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "takemuran-wrapconsist"
version = "0.1.0"
description = "比对多条响应的外层结构，标出包装字段缺失或类型变化"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "takemuran" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://takemuran.github.io"
Repository = "https://github.com/takemuran/wrapconsist"
Issues = "https://github.com/takemuran/wrapconsist/issues"

[project.scripts]
wrapconsist = "wrapconsist:main"

[tool.setuptools]
py-modules = ["wrapconsist"]
